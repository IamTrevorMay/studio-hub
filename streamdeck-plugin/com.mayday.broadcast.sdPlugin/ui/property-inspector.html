<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Mayday Broadcast</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 12px; color: #e5e7eb; background: #0f0f1a;
      margin: 0; padding: 12px;
    }
    .row { margin-bottom: 10px; }
    label {
      display: block; font-size: 10px; text-transform: uppercase;
      letter-spacing: 0.05em; color: rgba(255,255,255,0.6);
      margin-bottom: 4px; font-weight: 600;
    }
    input, select {
      width: 100%; box-sizing: border-box;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 4px; color: #fff; padding: 6px 8px; font-size: 12px; outline: none;
    }
    input:focus, select:focus { border-color: #6366f1; }
    button {
      background: #6366f1; color: white; border: none; border-radius: 4px;
      padding: 6px 12px; font-size: 11px; font-weight: 600; cursor: pointer;
      width: 100%; margin-top: 4px;
    }
    button:hover { background: #4f46e5; }
    .status {
      font-size: 10px; color: rgba(255,255,255,0.55); margin-top: 4px;
    }
    .status.ok { color: #22c55e; }
    .status.err { color: #ef4444; }
    h3 {
      font-size: 11px; color: rgba(255,255,255,0.7);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 4px; margin: 16px 0 8px;
    }
    .hint { font-size: 10px; color: rgba(255,255,255,0.45); margin-top: 4px; line-height: 1.4; }
  </style>
</head>
<body>
  <h3>Connection</h3>
  <div class="row">
    <label>Mayday base URL</label>
    <input type="text" id="baseUrl" placeholder="https://studio-hub.vercel.app" />
    <div class="hint">No scheme on local dev (use vercel preview URL or your custom domain).</div>
  </div>
  <div class="row">
    <button onclick="saveConnection()">Save connection (shared)</button>
    <div id="connStatus" class="status">Not connected</div>
  </div>

  <h3>Session</h3>
  <div class="row">
    <label>Session ID</label>
    <input type="text" id="sessionId" placeholder="UUID of an active broadcast session" />
  </div>
  <div class="row">
    <button onclick="loadAssets()">Load assets</button>
    <div id="loadStatus" class="status"></div>
  </div>

  <h3>Asset</h3>
  <div class="row">
    <label>Asset</label>
    <select id="assetSelect">
      <option value="">-- Select asset (optional for slideshow_visible_*) --</option>
    </select>
  </div>
  <div class="row">
    <button onclick="saveSettings()">Save button</button>
  </div>

  <script src="property-inspector.js"></script>
</body>
</html>
